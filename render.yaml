# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# Secrets marked "sync: false" are typed once in the Render dashboard, never committed.
services:
  - type: web
    name: clinique-physio-api
    runtime: python
    plan: free
    region: virginia  # close to the Neon database (AWS us-east-1)
    rootDir: api
    buildCommand: pip install -r requirements.txt
    # Apply database migrations, then start the API. --proxy-headers makes rate limiting
    # use the real client IP behind Render's proxy.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # The web app (Vercel) and the API (Render) are different sites, so the refresh
      # cookie must be SameSite=None; it is still httpOnly and Secure (HTTPS only).
      - key: COOKIE_SAMESITE
        value: none
