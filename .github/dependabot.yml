# Dependabot: weekly pull requests for outdated or vulnerable dependencies (spec 7.1, 7.2).
# Minor and patch updates are grouped to keep the number of pull requests small.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Major versions are upgraded on purpose, together and with testing, never one by one:
    # React 18 and ESLint 9 are the chosen versions for this project (react and react-dom
    # must always have the same version).
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    # Expo packages must move together with the Expo SDK; upgrade them on purpose, not one by one.
    ignore:
      - dependency-name: "expo*"
      - dependency-name: "react-native*"
      - dependency-name: "react"
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      dotnet-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
