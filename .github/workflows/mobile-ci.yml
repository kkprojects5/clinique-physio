# Mobile app continuous integration (spec section 7.2).
name: mobile-ci

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install exact dependencies (npm ci)
        run: npm ci

      - name: Lint (ESLint, Expo rules)
        run: npm run lint

      - name: Type-check (TypeScript)
        run: npm run typecheck

      - name: Tests (Jest + React Native Testing Library)
        run: npm test -- --ci
