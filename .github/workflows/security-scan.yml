# Dynamic security scan with OWASP ZAP (D3 security audit).
# Started by hand: Actions > security-scan > Run workflow, with the label "before" or "after".
# Each job uploads its HTML, Markdown and JSON reports as an artifact of the run.
#
# Three scans:
# 1. live-web: the website on Vercel, passive only (ZAP reads the pages, sends no attacks).
# 2. live-api: the API on Render, from its OpenAPI description, passive only (safe mode).
# 3. api-active: a throwaway copy of the API started inside this job, with its own database
#    and fictional data, attacked actively (injection, XSS, path traversal...). The live
#    system and its data are never attacked.
name: security-scan

on:
  workflow_dispatch:
    inputs:
      label:
        description: "before or after (used in the report names)"
        required: true
        default: before
        type: choice
        options: [before, after]
      web_url:
        description: "Website to scan"
        default: https://clinique-physio.vercel.app
      api_url:
        description: "API to scan"
        default: https://clinique-physio-api.onrender.com

permissions:
  contents: read

jobs:
  live-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wake the API up (the free plan sleeps when idle)
        run: curl -s -o /dev/null --retry 6 --retry-delay 10 "${{ inputs.api_url }}/health" || true
      - name: ZAP baseline scan of the website (passive)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.web_url }}
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-${{ inputs.label }}-live-web

  live-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wake the API up
        run: curl -s -o /dev/null --retry 6 --retry-delay 10 "${{ inputs.api_url }}/health" || true
      - name: ZAP API scan of the live API (safe mode, passive)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: ${{ inputs.api_url }}/openapi.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: "-S -a"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-${{ inputs.label }}-live-api

  api-active:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: physio
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: physio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U physio -d physio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Throwaway values for this job only. No real secret is used; no email leaves the job.
    env:
      DATABASE_URL: postgresql+psycopg://physio:ci-only-password@localhost:5432/physio
      JWT_SECRET: zap-only-jwt-secret-not-used-anywhere-else-0123456789
      FIELD_ENCRYPTION_KEY: rQ0kC2Jx0c3kWbqgJzQvYQe0m2lJ3H6xg5D2K8nWZ4o=
      ENVIRONMENT: production
      ALLOWED_ORIGINS: https://clinique-physio.vercel.app
      SEED_STAFF_PASSWORD: zap-only-Staff-Passw0rd-2026
      SEED_PATIENT_PASSWORD: zap-only-Patient-Passw0rd-2026
      OPENAI_API_KEY: ""
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Install the API
        run: pip install -r requirements.txt
      - name: Database and fictional demo data
        run: |
          alembic upgrade head
          python -m app.seed
          python -m app.chatbot.ingest
      - name: Start the API in the background
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../api.log 2>&1 &
          curl -s --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8000/health
      - name: ZAP API scan with active attacks (throwaway copy only)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: http://localhost:8000/openapi.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-${{ inputs.label }}-api-active
      - name: Server errors seen during the attack (a 500 can hide a bug)
        if: always()
        run: |
          echo "HTTP 500 answers during the scan:"
          grep -c '" 500' ../api.log || true
          grep -E 'Traceback|ERROR' ../api.log | head -40 || true
